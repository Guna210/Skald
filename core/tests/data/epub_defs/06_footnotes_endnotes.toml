[[spine]]
id = "ch1"
href = "ch1.xhtml"
body_xhtml = """
<h1>Chapter 1: Footnotes</h1>
<p>The manor stood above the meadow<a epub:type="noteref" href="#fn1">1</a> where cattle grazed peacefully through the long, golden summer afternoon.</p>
<p>Her uncle kept an almanac beside the hearth<sup><a epub:type="noteref" href="#fn2">[2]</a></sup> and recorded every autumn frost and winter gale without fail.</p>
<aside epub:type="footnote" id="fn1">
  <p>Built in 1742 of local limestone.</p>
</aside>
<aside epub:type="footnote" id="fn2">
  <p>Published annually in Bath.</p>
</aside>
"""

[[spine]]
id = "ch2"
href = "ch2.xhtml"
body_xhtml = """
<h1>Chapter 2: Endnotes</h1>
<p>When the carriage arrived at twilight<a role="doc-noteref" href="#en1">*</a> the wrought-iron lanterns along the gravel avenue had just been lit.</p>
<p>Hot tea was served in the oak drawing room while November rain drummed steadily against the tall bay windows.</p>
<aside epub:type="endnote" id="en1">
  <p>Twilight fell around five o'clock in November.</p>
</aside>
"""


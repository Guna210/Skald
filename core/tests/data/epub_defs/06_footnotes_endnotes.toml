[[spine]]
id = "ch1"
href = "ch1.xhtml"
body_xhtml = """
<h1>Chapter 1: Footnotes</h1>
<p>The stone manor stood high above the green meadow<a epub:type="noteref" href="#fn1">1</a> where spotted cattle grazed peacefully through the long, golden summer afternoon.</p>
<p>Her elderly uncle kept a leather-bound almanac beside the warm hearth<sup><a epub:type="noteref" href="#fn2">[2]</a></sup> and faithfully recorded every early autumn frost and winter gale.</p>
<aside epub:type="footnote" id="fn1">
  <p>Built in 1742 of local limestone.</p>
</aside>
<aside epub:type="footnote" id="fn2">
  <p>Published annually in Bath.</p>
</aside>
"""

[[spine]]
id = "ch2"
href = "ch2.xhtml"
body_xhtml = """
<h1>Chapter 2: Endnotes</h1>
<p>When the black traveling carriage arrived slowly at twilight<a role="doc-noteref" href="#en1">*</a> the tall wrought-iron lanterns along the gravel avenue had only just been lit.</p>
<p>Hot tea was promptly served in the oak drawing room while cold November rain drummed steadily against all the tall latticed bay windows.</p>
<aside epub:type="endnote" id="en1">
  <p>Twilight fell around five o'clock in November.</p>
</aside>
"""


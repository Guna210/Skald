cover_mode = "none"

[[spine]]
id = "acts"
href = "acts.xhtml"
body_xhtml = """
<section id="act1">
  <h1>Act I: The Courtyard</h1>
  <p>Morning sunlight slanted across the cobblestones while the baker arranged warm loaves in the timber window.</p>
  <p>Two messengers paused beside the stone fountain to trade rumors about the arriving steamship.</p>
</section>
<section id="act2">
  <h1>Act II: The Council Hall</h1>
  <p>Inside the oak-panelled chamber, lanterns burned brightly despite the high windows overlooking the square.</p>
  <p>Everyone leaned forward as the clerk unrolled the parchment scroll and cleared his throat to begin.</p>
</section>
<section id="act3">
  <h1>Act III: The Bridge</h1>
  <p>By dusk a cool river mist rose beneath the iron arches and softened the distant echo of footsteps.</p>
  <p>A single violin carried a quiet melody from the riverbank until the last ferry pulled away.</p>
</section>
"""

[[spine]]
id = "epilogue"
href = "epilogue.xhtml"
body_xhtml = """
<h1>Epilogue</h1>
<p>Years later, travelers passing through the valley still pointed out the old clocktower above the cobbled square.</p>
<p>None of the ledgers remained, yet the tune played beside the river lingered in the memory of the town.</p>
"""


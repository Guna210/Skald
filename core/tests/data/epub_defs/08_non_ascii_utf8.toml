href = "chapitre_éàü_01.xhtml"
body_xhtml = """
<h1>Chapitre 1 : À l’aube</h1>
<p>Sur la terrasse du café, l’horloge de la gare sonna six heures — un timbre clair dans l’air frais du matin.</p>
<p>« Avez-vous apporté les cahiers reliés ? » demanda Élodie en posant sa tasse de porcelaine blanche sur le marbre.</p>
"""

[[spine]]
id = "ch2"
href = "kapitel_über_α.xhtml"
body_xhtml = """
<h1>Chapitre 2 : L’étoile α</h1>
<p>Dans l’observatoire voisin, l’astronome nota la déclinaison de l’étoile α sur une feuille quadrillée avec soin.</p>
<p>Les volets s’ouvrirent vers l’ouest où s’effaçaient déjà les dernières lueurs argentées de la nuit d’hiver.</p>
"""


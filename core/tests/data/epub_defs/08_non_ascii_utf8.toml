[[spine]]
id = "ch1"
href = "chapitre_éàü_01.xhtml"
body_xhtml = """
<h1>Chapitre 1 : À l’aube</h1>
<p>Sur la terrasse du vieux café, l’horloge de la gare voisine sonna lentement six heures — un timbre clair dans l’air frais du matin d’hiver.</p>
<p>« Avez-vous apporté les cahiers reliés en toile ? » demanda Élodie en posant sa tasse de porcelaine blanche sur le marbre poli.</p>
"""

[[spine]]
id = "ch2"
href = "kapitel_über_α.xhtml"
body_xhtml = """
<h1>Chapitre 2 : L’étoile α</h1>
<p>Dans l’observatoire voisin, l’astronome nota la déclinaison précise de l’étoile α sur une large feuille quadrillée avec beaucoup de soin.</p>
<p>Les volets de bois s’ouvrirent vers l’ouest où s’effaçaient déjà les dernières lueurs argentées de la longue nuit d’hiver.</p>
"""


<h1>Chapter 1: Movable Type</h1>
<p>This book carries an encryption manifest solely to obfuscate embedded font files using both the IDPF and Adobe font-obfuscation schemes.</p>
<p>Because the content documents themselves are unencrypted, Skald imports every chapter normally without raising a DRM error.</p>
"""


body_xhtml = """
<h1>First Letter</h1>
<p>Yesterday afternoon the mail coachman delivered a heavy brass cylinder wrapped in oiled brown paper and sealed with green wax from Geneva.</p>
<p>Inside lay three folded linen sheets written in neat iron-gall ink, dated nearly forty winters before my own birth in our quiet valley.</p>
"""

[[spine]]
id = "ch2"
href = "ch2.xhtml"
body_xhtml = """
<h1>Second Letter</h1>
<p>Do not wind the copper escapement until the waning moon clears the eastern cathedral spire, or the silver chimes will strike completely out of measure.</p>
<p>My upstairs workshop still smells faintly of fresh cedar shavings and violin rosin whenever the cold evening rain taps against the leaded panes.</p>
"""


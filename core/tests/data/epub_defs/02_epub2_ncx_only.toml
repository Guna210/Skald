body_xhtml = """
<h1>First Letter</h1>
<p>Yesterday afternoon the postman delivered a brass cylinder wrapped in oiled brown paper from Geneva.</p>
<p>Inside lay three folded sheets written in neat iron-gall ink, dated nearly forty winters before my own birth.</p>
"""

[[spine]]
id = "ch2"
href = "ch2.xhtml"
body_xhtml = """
<h1>Second Letter</h1>
<p>Do not wind the escapement until the moon clears the eastern spire, or the chimes will strike out of measure.</p>
<p>My workshop still smells of cedar shavings and rosin whenever the evening rain taps against the leaded panes.</p>
"""


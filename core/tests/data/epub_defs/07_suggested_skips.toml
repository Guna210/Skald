[meta]
id = "07_suggested_skips"
description = "Suggested skip detection: ~300-char items testing landmarks-only vs in-doc epub:type-only, cumulative skip_reasons, unmarked short, and 199/200-char boundary"

[epub]
version = "3.0"
identifier = "urn:uuid:11111111-1111-4111-8111-000000000007"
title = "Front and Back Matter"
authors = ["George Eliot"]
language = "en"
has_nav = true
has_ncx = false
cover_mode = "none"

# Marked ONLY via landmarks (no in-document epub:type)
[[spine]]
id = "cover"
href = "cover.xhtml"
body_xhtml = """
<h1>Cover Page</h1>
<p>First Edition Paperback Cover. Illustrated with copperplate woodcut engravings from the London press, sewn cleanly on archival linen cords, and bound in deep navy buckram cloth with bright gilt lettering stamped across both spine and front board for university library collections everywhere.</p>
"""

# Marked ONLY via landmarks (no in-document epub:type)
[[spine]]
id = "copyright"
href = "copyright.xhtml"
body_xhtml = """
<h1>Copyright</h1>
<p>Published in 1922 by Albion House Publishers, London and Edinburgh. All rights in typography, woodcut plate restoration, proofreading, and binding notes in this archival digital edition are expressly preserved for long-term bibliographic reference, scholarly citation, and classroom study only.</p>
"""

# Marked ONLY via in-document epub:type (no landmarks entry)
[[spine]]
id = "toc_page"
href = "toc.xhtml"
body_xhtml = """
<section epub:type="toc">
  <h1>Contents</h1>
  <p>Preliminary Dedication — Chapter 1: The Mill by the Stream — Short Colophon Notice — Exact Character Threshold Boundary Samples for Automated Importer Checks — Comprehensive Analytical Index of Proper Names, Geographic Locations, Historical Dates, and Architectural Terms Across the Book.</p>
</section>
"""

[[spine]]
id = "dedication"
href = "dedication.xhtml"
body_xhtml = """
<h1>Dedication</h1>
<p>For everyone who listens to stories by the fire.</p>
"""

# Cumulative reasons: both epub:type="copyright-page" and <200 chars -> ["copyright-page", "short"]
[[spine]]
id = "short_notice"
href = "short_notice.xhtml"
body_xhtml = """
<section epub:type="copyright-page">
  <h1>Colophon</h1>
  <p>Set in Caslon type at Oxford in autumn.</p>
</section>
"""

# Explicit boundary: exactly 199 characters (unmarked -> suggested_skip = true, ["short"])
[[spine]]
id = "boundary_199"
href = "boundary_199.xhtml"
body_xhtml = """
<h1>Short Boundary</h1>
<p>This unmarked note stops at one hundred ninety-nine characters so that automated checks confirm it sits right below the two hundred character threshold across every automated run here.</p>
"""

# Explicit boundary: exactly 200 characters (unmarked -> suggested_skip = false, [])
[[spine]]
id = "boundary_200"
href = "boundary_200.xhtml"
body_xhtml = """
<h1>Exact Boundary</h1>
<p>This unmarked note spans precisely two hundred characters so that automated checks verify items meeting the two hundred character threshold stay active and are not skipped by the rules.</p>
"""

[[spine]]
id = "ch1"
href = "ch1.xhtml"
body_xhtml = """
<h1>Chapter 1: The Mill by the Stream</h1>
<p>Every spring the snowmelt swelled the river below the stone weir until the oak waterwheel turned all day and long into the quiet dusk.</p>
<p>Children gathered along the wooden footbridge to watch willow leaves spin through the foam below the sluice gate.</p>
"""

# Marked ONLY via in-document epub:type (no landmarks entry)
[[spine]]
id = "index_page"
href = "index.xhtml"
body_xhtml = """
<section epub:type="index">
  <h1>Index</h1>
  <p>Albion House Publishers, 2; Footbridge, wooden crossing, 14; Lanterns, stone harbour quay, 27; Millpond, winter river ice, 31; Riverbank, weeping willow trees, 45; Sluice gate, iron gearwork, 49; Waterwheel, oak timber construction, 52; Weir, masonry repair notes, 68.</p>
</section>
"""


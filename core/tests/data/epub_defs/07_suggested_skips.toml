href = "dedication.xhtml"
body_xhtml = """
<h1>Dedication</h1>
<p>For everyone who listens to stories by the fire.</p>
"""

[[spine]]
id = "ch1"
href = "ch1.xhtml"
body_xhtml = """
<h1>Chapter 1: The Mill by the Stream</h1>
<p>Every spring the snowmelt swelled the river below the stone weir until the oak waterwheel turned all day and long into the quiet dusk.</p>
<p>Children gathered along the wooden footbridge to watch willow leaves spin through the foam below the sluice gate.</p>
"""


[meta]
id = "01_epub3_basic"
description = "EPUB 3 with nav and NCX (differing titles -> nav wins), multiple authors, EPUB 3 cover-image property, and three chapters"

[epub]
version = "3.0"
identifier = "urn:uuid:11111111-1111-4111-8111-000000000001"
title = "The North Wind"
authors = ["Ada Lovelace", "Charles Babbage"]
language = "en"
has_nav = true
has_ncx = true
cover_mode = "epub3"
cover_href = "images/cover.png"

[[spine]]
id = "ch1"
href = "ch1.xhtml"
body_xhtml = """
<h1>Chapter 1: Departure</h1>
<p>The harbor bell rang three times before the sails caught the cold northern breeze along the granite quay and carried our timber schooner past the stone breakwater.</p>
<p>Clara tightened her woollen scarf and watched the brass lantern on the pier shrink into a steady amber spark across the dark winter water.</p>
"""

[[spine]]
id = "ch2"
href = "ch2.xhtml"
body_xhtml = """
<h1>Chapter 2: Open Sea</h1>
<p>By noon the rocky coastline had vanished behind a thick bank of silver mist, leaving only the rhythmic creak of timber and tarred hemp rope in the rigging.</p>
<p>Every watch brought fresh constellations overhead, charted carefully in pencil inside the captain's weathered leather logbook beside the compass binnacle.</p>
"""

[[spine]]
id = "ch3"
href = "ch3.xhtml"
body_xhtml = """
<h1>Chapter 3: Landfall</h1>
<p>At daybreak a jagged line of snowy ridges broke the pale horizon, gleaming soft rose above the quiet northern fjord and the sheltered harbour anchorage.</p>
<p>Rowboats were lowered swiftly into the glassy green inlet while white gulls wheeled and cried above the cedar boathouses along the rocky shore.</p>
"""


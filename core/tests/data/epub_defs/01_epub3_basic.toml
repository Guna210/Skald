[meta]
id = "01_epub3_basic"
description = "EPUB 3 with nav, multiple authors, EPUB 3 cover-image property, and three chapters"

[epub]
version = "3.0"
identifier = "urn:uuid:11111111-1111-4111-8111-000000000001"
title = "The North Wind"
authors = ["Ada Lovelace", "Charles Babbage"]
language = "en"
has_nav = true
has_ncx = false
cover_mode = "epub3"
cover_href = "images/cover.png"

[[spine]]
id = "ch1"
href = "ch1.xhtml"
body_xhtml = """
<h1>Chapter 1: Departure</h1>
<p>The harbor bell rang three times before the sails caught the cold northern breeze along the granite quay.</p>
<p>Clara tightened her woollen scarf and watched the lantern on the pier shrink into a steady amber spark across the dark water.</p>
"""

[[spine]]
id = "ch2"
href = "ch2.xhtml"
body_xhtml = """
<h1>Chapter 2: Open Sea</h1>
<p>By noon the coastline had vanished behind a bank of silver mist, leaving only the rhythmic creak of timber and rope.</p>
<p>Every watch brought fresh constellations overhead, charted carefully in pencil inside the captain's weathered leather logbook.</p>
"""

[[spine]]
id = "ch3"
href = "ch3.xhtml"
body_xhtml = """
<h1>Chapter 3: Landfall</h1>
<p>At daybreak a line of snowy ridges broke the horizon, gleaming pale rose above the quiet fjord.</p>
<p>Rowboats were lowered into the glassy inlet while gulls wheeled and cried above the wooden boathouses along the shore.</p>
"""


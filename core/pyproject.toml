[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "skald-core"
version = "0.1.0"
description = "Skald core engine for turning e-books into audiobooks with local TTS models."
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "lxml==6.1.3",
  "pydantic==2.14.3",
  "numpy==2.5.4",
  "soundfile==0.14.0",
  "psutil==7.2.2",
  "requests==2.34.2",
  "pysbd==0.3.4",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "pytest-timeout==2.4.0",
  "ruff==0.17.5",
  "mypy==2.4.1",
  "types-requests==2.33.0.20261030",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["skald_core*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["skald_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "network: tests that make live network requests",
  "slow: slow-running tests",
  "torch: tests that require PyTorch",
  "gpu: tests that require an NVIDIA GPU",
]

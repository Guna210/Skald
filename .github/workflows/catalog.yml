name: Catalog

on:
  pull_request:
    paths:
      - "catalog/**"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  validate:
    name: validate catalog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: .cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('scripts/deps.lock.json', 'core/pyproject.toml', 'worker/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache uv and vendor
        uses: actions/cache@v6
        with:
          path: |
            .cache/uv
            vendor/ffmpeg
            vendor/uv
            vendor/python
          key: ${{ runner.os }}-vendor-${{ hashFiles('scripts/deps.lock.json') }}

      - name: Run setup
        shell: bash
        run: ./scripts/setup.sh

      - name: Validate catalog
        shell: bash
        run: core/.venv/bin/python -m skald_core.catalog.validate catalog/catalog.json --network

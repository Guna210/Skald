# TEMPORARY - spike T03.4 only. Deleted in the last commit of the task branch; must never reach master.
# Runs docs/spikes/scripts/spike.py on Windows and Linux runners to collect the numbers in docs/spikes/engine-packs.md.
name: Spike T03.4 engine packs

on:
  push:
    branches:
      - "task/T03.4-*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  spike:
    name: spike (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # ---------------- Linux ----------------
      - name: Setup (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: ./scripts/setup.sh > setup.log 2>&1 || { tail -50 setup.log; exit 1; }

      - name: Measure (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          PY=core/.venv/bin/python
          WORK="$HOME/sk"
          OTHER=/mnt/sk-other
          sudo mkdir -p "$OTHER" && sudo chown "$USER" "$OTHER"
          if [ "$(stat -c %d /mnt)" = "$(stat -c %d "$HOME")" ]; then OTHER=/dev/shm/sk-other; mkdir -p "$OTHER"; fi
          echo "work=$WORK other=$OTHER"; findmnt -T "$OTHER" || true
          $PY docs/spikes/scripts/spike.py lock --check
          $PY docs/spikes/scripts/spike.py measure --work "$WORK" --other-volume "$OTHER" \
            --only cold,warm,bytecode,tamper,move,deep,xvol,relocate,py311,proxy,tls,av
          $PY docs/spikes/scripts/spike.py measure --work "$WORK" --only prune,clean
          $PY docs/spikes/scripts/spike.py measure --work "$WORK" --packs cu12
          cp "$WORK/results.json" results-linux.json

      - name: Machine facts (Linux)
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          echo "core.autocrlf: $(git config --get core.autocrlf || echo unset)"
          df -hT / /mnt /dev/shm || true
          nproc; free -g | head -2

      # ---------------- Windows ----------------
      - name: Setup (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\scripts\setup.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Measure (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          function Run { & core\.venv\Scripts\python.exe docs\spikes\scripts\spike.py @args; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          $work = 'C:\sk'
          $other = 'D:\sk-other'
          if (-not (Test-Path 'D:\')) {
            # No second drive on this runner image: make a small NTFS volume from a VHD.
            "create vdisk file=C:\sk-other.vhdx maximum=8000 type=expandable`r`nattach vdisk`r`ncreate partition primary`r`nformat fs=ntfs quick`r`nassign letter=V" | Out-File -Encoding ascii C:\dp.txt
            diskpart /s C:\dp.txt | Write-Host
            $other = 'V:\sk-other'
          }
          New-Item -ItemType Directory -Force $other | Out-Null
          Write-Host "work=$work other=$other"

          Run lock --check
          $env:SPIKE_LABEL = ''
          Run measure --work $work --other-volume $other --only 'cold,warm,bytecode,tamper,move,deep,xvol,relocate,py311,proxy,tls'

          # Long paths. First run above: root ~200 chars with the runner's setting. Now: python.exe itself past 260,
          # then both again with the OS long-path switch flipped; restore it afterwards.
          $key = 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem'
          $orig = (Get-ItemProperty $key -Name LongPathsEnabled).LongPathsEnabled
          $env:SPIKE_DEEP_LEN = '245'; $env:SPIKE_LABEL = "-longpaths-$orig-root245"
          Run measure --work $work --only deep
          $flipped = 1 - $orig
          Set-ItemProperty $key -Name LongPathsEnabled -Value $flipped
          $env:SPIKE_DEEP_LEN = '200'; $env:SPIKE_LABEL = "-longpaths-$flipped-root200"
          Run measure --work $work --only deep
          $env:SPIKE_DEEP_LEN = '245'; $env:SPIKE_LABEL = "-longpaths-$flipped-root245"
          Run measure --work $work --only deep
          Set-ItemProperty $key -Name LongPathsEnabled -Value $orig
          $env:SPIKE_DEEP_LEN = ''

          # Antivirus. The runner image ships with Defender real-time scanning off and C:\ and D:\ excluded.
          # Measure that state, then switch scanning on (if the image allows it), measure again, and restore.
          $env:SPIKE_LABEL = 'Defender real-time scanning off (runner default)'
          Run measure --work $work --only av
          Remove-MpPreference -ExclusionPath 'C:\', 'D:\'
          Set-MpPreference -DisableRealtimeMonitoring $false
          Start-Sleep -Seconds 20
          $rt = (Get-MpComputerStatus).RealTimeProtectionEnabled
          $env:SPIKE_LABEL = "Defender real-time scanning switched on (RealTimeProtectionEnabled=$rt)"
          Run measure --work $work --only av
          Set-MpPreference -DisableRealtimeMonitoring $true
          Add-MpPreference -ExclusionPath 'C:\', 'D:\'
          $env:SPIKE_LABEL = ''

          Run measure --work $work --only 'prune,clean'
          Run measure --work $work --packs cu12
          Copy-Item "$work\results.json" results-windows.json

      - name: Machine facts (Windows)
        if: always() && runner.os == 'Windows'
        shell: powershell
        run: |
          Write-Host "core.autocrlf: $(git config --get core.autocrlf)"
          Get-Volume | Format-Table DriveLetter, FileSystemType, SizeRemaining, Size -AutoSize | Out-String | Write-Host
          Write-Host "workspace: $env:GITHUB_WORKSPACE"
          Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled | Format-List LongPathsEnabled | Out-String | Write-Host
          Get-MpComputerStatus | Format-List AMServiceEnabled, AntivirusEnabled, RealTimeProtectionEnabled, OnAccessProtectionEnabled, IsTamperProtected | Out-String | Write-Host
          Get-MpPreference | Format-List DisableRealtimeMonitoring, ExclusionPath | Out-String | Write-Host
          (Get-CimInstance Win32_ComputerSystem).NumberOfLogicalProcessors
